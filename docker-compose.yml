# Sobe só o banco. O Flask continua rodando normalmente, com o venv.
#   docker compose up -d      -> liga o Postgres
#   docker compose down       -> desliga (os dados ficam no volume)
#   docker compose down -v    -> desliga e APAGA os dados
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: loja123
      POSTGRES_DB: loja_ceramica
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
