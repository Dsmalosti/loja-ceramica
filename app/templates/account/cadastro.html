{% extends "base.html" %}
{% block title %}Criar conta · {{ site_name }}{% endblock %}

{% block content %}
<h1>Criar conta</h1>

<form method="post" class="formulario">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="nome">Nome</label>
  <input id="nome" name="nome" type="text" autocomplete="name" value="{{ dados.nome }}" required>

  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" autocomplete="email" value="{{ dados.email }}" required>

  <label for="senha">Senha (mínimo de 8 caracteres)</label>
  <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" required>

  <label for="confirmacao">Repita a senha</label>
  <input id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" minlength="8" required>

  <button type="submit" class="botao">Criar conta</button>
</form>

<p>Já tem conta? <a href="{{ url_for('account.login') }}">Entrar</a></p>
{% endblock %}
