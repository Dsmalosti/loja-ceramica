{% extends "base.html" %}
{% block title %}Esqueci minha senha · {{ site_name }}{% endblock %}

{% block content %}
<h1>Esqueci minha senha</h1>
<p>Digite o e-mail da sua conta. Se ele existir, enviaremos um link para você criar uma nova senha.</p>

<form method="post" class="formulario">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" autocomplete="email" required>

  <button type="submit" class="botao">Enviar link</button>
</form>

<p><a href="{{ url_for('account.login') }}">Voltar para entrar</a></p>
{% endblock %}
