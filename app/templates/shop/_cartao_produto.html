{# Recebe a variável "produto" (Product). Usado na home e na lista da loja. #}
<article class="cartao">
  <a href="{{ url_for('shop.produto', slug=produto.slug) }}">
    <div class="cartao__foto">
      {% if produto.imagem_principal %}
        <img src="{{ image_url(produto.imagem_principal.caminho) }}"
             alt="{{ produto.imagem_principal.alt or produto.nome }}" loading="lazy">
      {% else %}
        <div class="cartao__sem-foto">Sem foto</div>
      {% endif %}
      {% if not produto.disponivel %}
        <span class="selo">Indisponível</span>
      {% endif %}
    </div>
    <p class="cartao__categoria">{{ produto.categoria.nome }}</p>
    <h3>{{ produto.nome }}</h3>
  </a>
  <p class="preco">{{ produto.preco_centavos | brl }}</p>
</article>
