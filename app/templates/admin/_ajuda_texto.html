{# [back/painel-julia] Como formatar as descrições (mesmas regras em produto, curso e serviço) #}
<details class="ajuda-texto" id="ajuda-descricao">
  <summary>Como formatar o texto</summary>
  <ul>
    <li>Deixe uma <strong>linha em branco</strong> para começar outro parágrafo.</li>
    <li>Comece a linha com <code>- </code> para virar item de lista.</li>
    <li><code>**palavras**</code> ficam em <strong>negrito</strong>; <code>*palavras*</code> ficam em <em>destaque</em>.</li>
  </ul>
</details>
