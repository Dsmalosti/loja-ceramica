{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Editar serviço' if servico else 'Novo serviço' }} · Painel · {{ site_name }}{% endblock %}

{% block admin %}
<h1>{{ 'Editar serviço' if servico else 'Novo serviço' }}</h1>

<form method="post" class="formulario formulario--largo">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="titulo">Título</label>
  <input id="titulo" name="titulo" type="text" maxlength="150" value="{{ valores.titulo }}" required>

  <label for="descricao">Descrição</label>
  <textarea id="descricao" name="descricao" rows="6" maxlength="5000">{{ valores.descricao }}</textarea>

  <label class="campo-check">
    <input type="checkbox" name="ativo" {% if valores.ativo %}checked{% endif %}>
    Serviço ativo (aparece no site)
  </label>

  <div class="acoes">
    <button type="submit" class="botao">Salvar</button>
    <a href="{{ url_for('admin.servicos_lista') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
