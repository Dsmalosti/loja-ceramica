{# Moldura dos e-mails: estilos inline (clientes de e-mail ignoram CSS externo). #}
<!doctype html>
<html lang="pt-BR">
<body style="margin:0;padding:24px 12px;background:#f6efe3;font-family:Arial,Helvetica,sans-serif;color:#3b2d1f;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr><td style="padding:24px 28px;border-bottom:3px solid #C8792C;font-family:Georgia,serif;font-size:20px;color:#5B4632;">{{ site_name }}</td></tr>
    <tr><td style="padding:28px;font-size:15px;line-height:1.6;">
      {% block corpo %}{% endblock %}
    </td></tr>
    <tr><td style="padding:16px 28px;font-size:12px;color:#8a7a68;">Você recebeu este e-mail porque tem uma conta em {{ site_name }}.</td></tr>
  </table>
</body>
</html>
